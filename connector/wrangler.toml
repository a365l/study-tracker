name = "study-tracker-connector"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
TIMEZONE = "Europe/London"

# MCP_KEY and PC_TOKEN are secrets: npx wrangler secret put MCP_KEY

[[durable_objects.bindings]]
name = "TRACKER"
class_name = "Tracker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tracker"]
